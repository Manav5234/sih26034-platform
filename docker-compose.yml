services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sih26034
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sih26034
      JWT_SECRET: ${JWT_SECRET:-sih26034-dev-secret-change-in-production}
    depends_on:
      - postgres
    volumes:
      - uploads:/data/uploads

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      ENVIRONMENT: ${ENVIRONMENT:-development}

volumes:
  pgdata:
  uploads:
